# フェーズ2試作の確認: GitHub のランナー（外に出られるネットワーク）で YAMNet を実際に読み込み、
# fixtures の合成音と、本物の音（ESC-50 dog 40 本・犬以外 40 本、CC0 5 本。実行時に取得、リポジトリには入れない）を
# 聞かせて「犬らしさ」としきい値ごとの成績を Summary に表で出す。公開には関係しない（deploy-pages とは別）。
name: lab-yamnet
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/lab/**', 'app/js/dogcheck.js', 'tests/lab/**', '.github/workflows/lab-yamnet.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04  # ubuntu-latest は 2026-11-12 に 26.04 になり Playwright 1.56 が Chromium を入れられない（日報 2026-11-13）
    timeout-minutes: 30
    steps:
      # actions は 2026-11-22 に Node.js 24 で動く版（checkout/setup-node/upload-artifact v7、configure-pages v6、upload-pages-artifact v5、deploy-pages v5）に上げた（v4 系は Node.js 20 非推奨の警告。日報 2026-11-21）
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # ffmpeg の apt-get は 2026-11-19（30 分）・11-20（6 分 timeout）と 2 晩つづけて止まったので無くした。
      # CC0 の mp3 → WAV は上で入れた Chromium の Web Audio で復号する（tests/lab/decode.mjs。ffmpeg の復号と波形が一致することは作業環境で確認済み）
      # 2026-11-25: Dog play pant の音声 zip（377 MB）も落とす（PLAYPANT_AUDIO=1。ファイルに流し込む。Zenodo から 1〜数分の見込み。届かなければ飛ばす）
      - name: 検証データを取得（ESC-50 は GitHub raw、CC0 5 本は Hugging Face、Dog play pant の注釈と音声 zip は Zenodo。届かなければ飛ばす。mp3 は Chromium で WAV に）
        run: node tests/lab/fetch-data.mjs
        env: { PLAYPANT_AUDIO: '1' }
      # 2026-11-24: Dog play pant（Readme は CC BY-NC 4.0 → 検証専用）の注釈を読む。声の種類（Growl / Whine / Bark …）ごとの件数と長さ。
      # 2026-11-25: 音声 zip があれば WAV 30 本の一覧（長さ・形式・注釈との対応）も出す。
      # 2026-11-26: 2 層目の注釈の時刻で塊（うなり・吠え・くんくん・息・うめき・人の声、1 種類 20 本まで）を切り出して data/playpant/clips/ に置き、
      # 次の features-check.mjs が種類ごとの lvlDrop・MFCC の表を出す（ESC-50・CC0 の表とは別。YAMNet にはまだ通さない）
      - name: Dog play pant の注釈（声の種類ごとの件数・1 回の長さ）と音声 zip の WAV 一覧・塊の切り出し
        run: node tests/lab/playpant-check.mjs
      - name: 本体の吠え検出・ルールに本物の音を通す（Dog play pant の切り出しは種類ごとの表に）
        run: node tests/lab/features-check.mjs
      - name: tfjs の SRI（改ざん検知ハッシュ）が CDN の中身と一致するか
        run: node tests/lab/sri-check.mjs
      - name: YAMNet に通す（犬らしさ、しきい値表）
        run: node tests/lab/yamnet-check.mjs
      - name: 今夜の要点 3 行（吠え検出率・塊の犬らしさ・くんくん／うなり が吠えから離れたか。Summary の最後と注釈に）
        if: always()
        run: node tests/lab/highlights.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: yamnet-result
          path: tests/lab/out/
          if-no-files-found: ignore
