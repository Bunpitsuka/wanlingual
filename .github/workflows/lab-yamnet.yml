# フェーズ2試作の確認: GitHub のランナー（外に出られるネットワーク）で YAMNet を実際に読み込み、
# fixtures の合成音と、本物の音（ESC-50 dog 40 本・犬以外 40 本、CC0 5 本。実行時に取得、リポジトリには入れない）を
# 聞かせて「犬らしさ」としきい値ごとの成績を Summary に表で出す。公開には関係しない（deploy-pages とは別）。
name: lab-yamnet
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/lab/**', 'app/js/dogcheck.js', 'tests/lab/**', '.github/workflows/lab-yamnet.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04  # ubuntu-latest は 2026-11-12 に 26.04 になり Playwright 1.56 が Chromium を入れられない（日報 2026-11-13）
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: ffmpeg（CC0 の mp3 を WAV に変換するため。apt が固まっても 6 分で諦めて先へ進む。2026-11-19 の run 44370073648 が ここで 30 分止まった）
        timeout-minutes: 6
        continue-on-error: true
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq ffmpeg >/dev/null
      - name: 検証データを取得（ESC-50 は GitHub raw、CC0 5 本は Hugging Face。届かなければ飛ばす）
        run: node tests/lab/fetch-data.mjs
      - name: 本体の吠え検出・ルールに本物の音を通す
        run: node tests/lab/features-check.mjs
      - name: tfjs の SRI（改ざん検知ハッシュ）が CDN の中身と一致するか
        run: node tests/lab/sri-check.mjs
      - name: YAMNet に通す（犬らしさ、しきい値表）
        run: node tests/lab/yamnet-check.mjs
      - name: 今夜の要点 3 行（吠え検出率・塊の犬らしさ・くんくん／うなり が吠えから離れたか。Summary の最後と注釈に）
        if: always()
        run: node tests/lab/highlights.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yamnet-result
          path: tests/lab/out/
          if-no-files-found: ignore
