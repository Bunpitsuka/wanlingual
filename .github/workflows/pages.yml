# GitHub Pages へ app/ を自動デプロイする。
# 初回だけ人間の操作が必要: リポジトリの Settings → Pages → Source を「GitHub Actions」にする。
name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest は 2026-11-12 に 26.04 になり Playwright 1.56 が Chromium を入れられない（日報 2026-11-13）
    steps:
      # actions は 2026-11-22 に Node.js 24 で動く版（checkout/setup-node/upload-artifact v7、configure-pages v6、upload-pages-artifact v5、deploy-pages v5）に上げた（v4 系は Node.js 20 非推奨の警告。日報 2026-11-21）
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm run test:unit
  deploy:
    needs: test
    runs-on: ubuntu-24.04  # ubuntu-latest は 2026-11-12 に 26.04 になり Playwright 1.56 が Chromium を入れられない（日報 2026-11-13）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: app }
      # 2026-11-23・11-24 の 2 晩、upload 直後の deploy-pages@v5 が「No artifacts named "github-pages"」（Found 0 artifact(s)）で落ちた
      # （upload は成功していて成果物一覧には出る＝API に見えるまでの遅れ。どちらも前の push の 20 分以内の 2 回目の push）。
      # 成果物が API から見えるまで少し待ってから deploy する（失敗したときの部分再実行は成果物が 2 つになって効かないので、先に待つ）
      - name: 成果物が API から見えるまで待つ
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v5
