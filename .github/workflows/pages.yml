# GitHub Pages へ app/ を自動デプロイする。
# 初回だけ人間の操作が必要: リポジトリの Settings → Pages → Source を「GitHub Actions」にする。
name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest は 2026-11-12 に 26.04 になり Playwright 1.56 が Chromium を入れられない（日報 2026-11-13）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run test:unit
  deploy:
    needs: test
    runs-on: ubuntu-24.04  # ubuntu-latest は 2026-11-12 に 26.04 になり Playwright 1.56 が Chromium を入れられない（日報 2026-11-13）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: app }
      - id: deployment
        uses: actions/deploy-pages@v4
